{% extends "base_auth.html" %} {% block title %}Alimas | Login{% endblock %}

{% block body %}  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
          <div class="col-md-8 col-lg-6 col-xxl-3">
           <div class="card mb-0 shadow rounded-3">
            <div class="card-body p-4">
              
              <!-- Header -->
              <h3 class="text-center mb-4 fw-bold">Log in</h3>
              
              <!-- Logo + Brand Name -->
              <div class="d-flex align-items-center justify-content-center mb-4">
                <img src="../static/images/logos/logo.png" alt="Logo" style="width: 50px; height: auto;">
                <span style="font-size: 24px; font-weight: bold; margin-left: 10px;">Alimas</span>
              </div>
              
              <!-- Login Form -->
              <form id="loginForm">
                <div class="mb-3">
                  <label for="Email" class="form-label">Email</label>
                  <input type="email" class="form-control" id="Email" placeholder="Enter your email">
                </div>
               <div class="mb-3">
                <label for="Password" class="form-label">Password</label>
                <div class="position-relative">
                  <input type="password" class="form-control" id="Password" placeholder="Enter your password">
                  <i class="fa fa-eye toggle-password" data-target="Password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer;"></i>
                </div>
              </div>
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">
                      Remember me
                    </label>
                  </div>
                  <!-- <a class="text-primary fw-bold" href="./index.html">Forgot Password?</a> -->
                </div>
                
                <button type="button" class="btn btn-primary w-100 py-2 fs-5 mb-3 rounded-2" onclick="Login()">Sign In</button>
                
                <!-- <div class="text-center">
                  <p class="mb-0">New to Alimas? 
                    <a class="text-primary fw-bold" href="./authentication-register.html">Create an account</a>
                  </p>
                </div> -->
              </form>
            </div>
          </div>
          </div>  
  <script>
    $(document).ready(function () {
      const email = getCookie("email");
      const password = getCookie("password");

      if (email && password) {
          $('#Email').val(email);
          $('#Password').val(password);
          $('#rememberMe').prop('checked', true);
      }
     
      $(".toggle-password").click(function () {
        const targetId = $(this).data("target");
        const input = $("#" + targetId);
        const type = input.attr("type") === "password" ? "text" : "password";
        input.attr("type", type);

        $(this).toggleClass("fa-eye fa-eye-slash");
      });
  });
  $('#loginForm input').on('keypress', function (e) {
        if (e.which === 13) {
            e.preventDefault();
            Login();
        }
    });
    
  function Login(){
    $('#loaderOverlay').show();
        var email = $('#Email').val();
        var password = $('#Password').val();
        var remember = $('#rememberMe').is(':checked');

        if (!email) {
            showAlert("Please enter email.", "danger");
            return;
        }
        if (!password) {
            showAlert("Please enter password.", "danger");
            return;
        }

        if (remember) {
        setCookie("email", email, 30);
        setCookie("password", password, 30);
        } else {
            setCookie("email", "", -1);      
            setCookie("password", "", -1);
        }

        $.ajax({
            url: '/login',
            type: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({ email: email, password: password }),
            success: function (response) {
                if (response.status === 'success') {
                    showAlert("Welcome " + response.user.first_name + "!", "success");
                        window.location.href = "/home";
                } else {
                    showAlert(response.message, "danger");
                }
                $('#loaderOverlay').hide();
            },
            error: function (xhr) {
                let msg = "Something went wrong. Please try again.";
                if (xhr.responseJSON && xhr.responseJSON.message) {
                    msg = xhr.responseJSON.message;
                }
                showAlert(msg, "danger");
                $('#loaderOverlay').hide();
            }
        });
    }



function setCookie(name, value, days = 30) {
    const date = new Date();
    date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
    const expires = "; expires=" + date.toUTCString();
    document.cookie = `${name}=${encodeURIComponent(value)}${expires}; path=/`;
}

function getCookie(name) {
    const nameEQ = name + "=";
    const cookies = document.cookie.split(';');
    for (let c of cookies) {
        c = c.trim();
        if (c.startsWith(nameEQ)) {
            return decodeURIComponent(c.substring(nameEQ.length));
        }
    }
    return null;
}

  </script>
  {% endblock %}
