<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aalimas{% endblock %}</title>
  <link rel="shortcut icon" type="image/png" href="../static/images/logos/logo.png" />
  <link rel="stylesheet" href="../static/css/styles.min.css" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="../static/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/alert.js"></script>
  <script src="../static/libs/apexcharts/dist/apexcharts.min.js"></script>
  <script src="../static/libs/simplebar/dist/simplebar.js"></script>
  <!-- solar icons -->
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <!-- SweetAlert CSS -->
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">

<!-- SweetAlert JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>
</head>

<body>
  <div id="loaderOverlay">Please Wait...</div>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <div
      class="position-relative overflow-hidden text-bg-light min-vh-100 d-flex align-items-center justify-content-center">
      <div class="d-flex align-items-center justify-content-center w-100">
        <div class="row justify-content-center w-100">
         {% block body %}
         {% endblock %}
        </div>
      </div>
    </div>
  </div>
  <footer class="bg-white border-top shadow-sm py-2 fixed-bottom">
  <div class="container-fluid">
    <div class="row align-items-center text-muted small">
      <div class="col-md-12 text-center fw-semibold text-dark">
        Powered by
        <a
          href="https://www.linkedin.com/in/mohamed-riyas-khan-815b2a232/"
          target="_blank"
          class="text-primary text-decoration-none"
        >
          RsJ Industry
        </a>
      </div>
    </div>
  </div>
</footer>

</body>

</html>
