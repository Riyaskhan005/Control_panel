<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alimas{% endblock %}</title>
  <link rel="shortcut icon" type="image/png" href="../static/images/logos/logo.png" />
  <link rel="stylesheet" href="../static/css/styles.min.css" />

  <!-- Theme style -->
  <link rel="stylesheet" href="../static/css/adminlte.min.css">
</head>

<body>
   <!-- Loader Overlay -->
  <div id="loaderOverlay">Please Wait...</div>
  <!--  Body Wrapper -->
  <div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full"
    data-sidebar-position="fixed" data-header-position="fixed">
    <!-- Sidebar Start -->
    <aside class="left-sidebar">
      <!-- Sidebar scroll-->
      <div>
        <div class="brand-logo d-flex align-items-center justify-content-between">
           <div style="display: flex; align-items: center; gap: 10px;">
            <img src="../static/images/logos/logo.png" alt="Logo" style="width: 60px; height: 60px;">
            <strong style="font-size: 18px; color: black;">Aalimas</strong>
          </div>
          </a>
          <div class="close-btn d-xl-none d-block sidebartoggler cursor-pointer" id="sidebarCollapse">
            <i class="ti ti-x fs-8"></i>
          </div>
        </div>
        <!-- Sidebar navigation-->
        <nav class="sidebar-nav scroll-sidebar" data-simplebar="">
          <ul id="sidebarnav">
            <li class="nav-small-cap">
              <iconify-icon icon="solar:menu-dots-linear" class="nav-small-cap-icon fs-4"></iconify-icon>
              <span class="hide-menu">Home</span>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link {% if request.path.startswith('/home') %}active{% endif %}" href="/home" aria-expanded="false">
                <iconify-icon icon="solar:widget-add-line-duotone"></iconify-icon>
                <span class="hide-menu">Dashboard</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link {% if request.path.startswith('/user') %}active{% endif %}" href="/user" aria-expanded="false">
                <i class="ti ti-user"></i>
                <span class="hide-menu">Manage customers</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link {% if request.path.startswith('/todayspecial') %}active{% endif %}" href="/todayspecial" aria-expanded="false">
                <i class="ti ti-meat"></i>
                <span class="hide-menu">Manage snaks</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link {% if request.path.startswith('/customerdues') %}active{% endif %}" href="/customerdues" aria-expanded="false">
                <i class="ti ti-clock"></i>
                <span class="hide-menu">Customer Dues</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link {% if request.path.startswith('/dailysales') %}active{% endif %}" href="/dailysales" aria-expanded="false">
                <i class="ti ti-calculator"></i>
                <span class="hide-menu">Sales Calculation</span>
              </a>
            </li>
            <li class="sidebar-item">
              <a class="sidebar-link" href="/logout" aria-expanded="false">
                <i class="ti ti-logout"></i>
                <span class="hide-menu">Log out</span>
              </a>
            </li>
          </ul>
        </nav>
        <!-- End Sidebar navigation -->
      </div>
      <!-- End Sidebar scroll-->
    </aside>
    <!--  Sidebar End -->
    <!--  Main wrapper -->
    <div class="body-wrapper">
      <!--  Header Start -->
      <header class="app-header shadow-sm"style="background-color: #fff;">
        <nav class="navbar navbar-expand-lg navbar-light">
          <ul class="navbar-nav">
            <li class="nav-item d-block d-xl-none">
              <a class="nav-link sidebartoggler " id="headerCollapse" href="javascript:void(0)">
                <i class="ti ti-menu-2"></i>
              </a>
            </li>
          </ul>
           <div id="dynamicHeaderTitle" class="ms-3 fs-6 fw-bold text-dark"></div>
          <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
            <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
              <li class="nav-item dropdown">
                <a class="nav-link " href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
                  aria-expanded="false">
                  <img src="{{ session['profilepath'] }}" alt="" width="35" height="35" class="rounded-circle">
                </a>
                <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
                  <div class="message-body">
                    <a href="/settings" class="d-flex align-items-center gap-2 dropdown-item">
                      <i class="ti ti-settings fs-6"></i>
                      <p class="mb-0 fs-3">Settings</p>
                    </a>
                    <a href="/logout" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </nav>
      </header>
      <!--  Header End -->
      <div class="body-wrapper-inner">
        <div class="container-fluid">
          <!--  Row 1 -->
          <div class="row">
           {% block body %}
            <!-- This block will be replaced in child templates -->
            {% endblock %}
          </div>
          
         
        </div>
      </div>
      <!-- Footer Start -->
    <footer class="footer bg-light text-center py-3 shadow-sm">
      <div class="container">
        <span class="text-muted">All rights reserved © Allimas Thanthoori Chai</span>
      </div>
    </footer>
    <!-- Footer End -->
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
      <script src="https://cdn.datatables.net/1.13.3/js/jquery.dataTables.min.js"></script>
     <link rel="stylesheet" href="https://cdn.datatables.net/1.13.3/css/jquery.dataTables.min.css">

     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
<script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <script src="../static/libs/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/alert.js"></script>
  <script src="../static/libs/apexcharts/dist/apexcharts.min.js"></script>
  <script src="../static/libs/simplebar/dist/simplebar.js"></script>
    <script src="../static/js/app.min.js"></script>
  <!-- solar icons -->
  <script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.8/dist/iconify-icon.min.js"></script>
  <!-- SweetAlert CSS -->
<link href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.min.css" rel="stylesheet">

<!-- SweetAlert JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.3/dist/sweetalert2.all.min.js"></script>

</body>

</html>
