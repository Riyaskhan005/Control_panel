{% extends "base.html" %} {% block title %} Alimas | Settings {% endblock %}
{% block body %}
<!-- Font Awesome for pencil icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  .profile-container {
    position: relative;
    display: inline-block;
  }

  .profile-user-img {
    width: 120px;
    height: 120px;
  }
.edit-icon {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 32px;
  height: 32px;
  background-color: #007bff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  border: 2px solid white;
  font-size: 14px;
}

  .edit-icon:hover {
    background-color: #0056b3;
  }

  #profileImage {
    display: none;
  }
</style>
<div class="content-wrapper" style="min-height: 1604.8px;">
    

    <!-- Main content -->
    <section class="content">
        <div class="row">
          <div class="col-md-3">

            <!-- Profile Image -->
            <div class="card card-primary card-outline">
              <div class="card-body box-profile">
                <div class="text-center">
                   <div class="profile-container">
                      <img class="profile-user-img" src="{{ session['profilepath'] }}" alt="User profile picture">

                      <!-- Label acts as a button for file input -->
                      <label for="profileImage" class="edit-icon">
                        <i class="fas fa-pencil-alt"></i>
                      </label>

                      <!-- Hidden File Input -->
                      <input type="file" id="profileImage" accept="image/*" onchange="uploadProfileImage(this)">
                    </div>
                </div>

                <h3 class="profile-username text-center">{{ session['user_name'] }}</h3>

              </div>
              <!-- /.card-body -->
            </div>
            <!-- /.card -->
          </div>
          <!-- /.col -->
          <div class="col-md-9">
            <div class="card">
              <div class="card-header p-2">
                <ul class="nav nav-pills">
                  <li class="nav-item"><a class="nav-link active" data-toggle="tab">Settings</a></li>
                </ul>
              </div><!-- /.card-header -->
              <div class="card-body">
                  <div class="tab-pane active" id="settings">
                    <form class="form-horizontal">
                      <div class="form-group row mb-3">
                        <label for="oldpassword" class="col-sm-2 col-form-label">Old Password</label>
                        <div class="col-sm-4">
                          <input type="password" class="form-control" id="oldpassword" placeholder="Old password">
                        </div>
                      </div>
                      <div class="form-group row mb-3">
                      <label for="newpassword" class="col-sm-2 col-form-label">New Password</label>
                      <div class="col-sm-4">
                          <input type="password" class="form-control" id="newpassword" placeholder="New password">
                          <div id="passwordStrength" class="mt-1"></div>
                      </div>
                  </div>
                      <div class="form-group row mb-3">
                        <label for="confirmpassword" class="col-sm-2 col-form-label">Confirm Password</label>
                        <div class="col-sm-4">
                          <input type="password" class="form-control" id="confirmpassword" placeholder="Confirm password">
                        </div>
                      </div>
                      <div class="form-group row">
                        <div class="offset-sm-2 col-sm-10">
                          <button type="button" class="btn btn-danger" onclick="changepassword()">Update</button>
                        </div>
                      </div>
                    </form>
                  </div>
                  <!-- /.tab-pane -->
                </div>
                <!-- /.tab-content -->
              </div><!-- /.card-body -->
            </div>
            <!-- /.card -->
          </div>
          <!-- /.col -->
        </div>
    </section>
    <!-- /.content -->
     <script>
       function uploadProfileImage(input) {
  const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif'];

  if (input.files && input.files[0]) {
    const file = input.files[0];
    const fileName = file.name.toLowerCase();
    const fileExtension = fileName.split('.').pop();

    if (!allowedExtensions.includes(fileExtension)) {
      showAlert('Invalid file type. Only JPG, JPEG, PNG, and GIF are allowed.','danger');
      input.value = ''; // reset file input
      return;
    }

    var formData = new FormData();
    formData.append('profileImage', file);

    $.ajax({
      url: '/settings/upload_profile_image',
      type: 'POST',
      data: formData,
      contentType: false,
      processData: false,
      success: function(response) {
        if (response.success) {
          $('.profile-user-img').attr('src', response.image_url);
          showAlert('Profile image updated successfully!',"success");
        } else {
          showAlert('Image upload failed: ' + response.message, 'danger');
        }
      },
      error: function() {
         showAlert('An error occurred while uploading the image.');
      }
    });
  }
}

function changepassword() {
    var oldPassword = $('#oldpassword').val();
    var newPassword = $('#newpassword').val();
    var confirmPassword = $('#confirmpassword').val();
    var strength = checkPasswordStrength(newPassword);

    if (!oldPassword) {
        showAlert("Enter new oldpassword", 'danger');
    }

    else if (!newPassword) {
        showAlert("Enter new password", 'danger');
    }
    else if (!confirmPassword) {
        showAlert("Enter new confirm password", 'danger');
    }

    else if (newPassword !== confirmPassword) {
        showAlert("New password and confirm password do not match!", 'danger');
    }

    else if (strength < 3) {
        showAlert("Password is too weak. Please choose a stronger password.", 'danger');
    }
    else{
      $.ajax({
        url: '/settings/change_password',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            old_password: oldPassword,
            new_password: newPassword
        }),
        success: function (response) {
            if (response.success) {
                showAlert(response.message,"success");
                $('#oldpassword').val('');
                $('#newpassword').val('');
                $('#confirmpassword').val('');
                $('#passwordStrength').html('');
            } else {
                 showAlert(response.message,'danger');
            }
        },
        error: function () {
             showAlert('Something went wrong, please try again later.', 'danger');
        }
    });
    }
    
}
function checkPasswordStrength(password) {
    var strength = 0;

    if (password.length >= 8) strength++;
    if (password.match(/[a-z]+/)) strength++;
    if (password.match(/[A-Z]+/)) strength++;
    if (password.match(/[0-9]+/)) strength++;
    if (password.match(/[$@#&!]+/)) strength++;

    return strength;
}
     </script>
{%endblock%}
