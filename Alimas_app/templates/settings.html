{% extends "base.html" %} {% block title %} Alimas | Settings {% endblock %}
{% block body %}
<!-- Font Awesome for pencil icon -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  .profile-container {
    position: relative;
    display: inline-block;
  }

  .profile-user-img {
    width: 120px;
    height: 120px;
  }
.edit-icon {
  position: absolute;
  bottom: 0;
  right: 0;
  width: 32px;
  height: 32px;
  background-color: #007bff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  color: white;
  border: 2px solid white;
  font-size: 14px;
}

  .edit-icon:hover {
    background-color: #0056b3;
  }

  #profileImage {
    display: none;
  }
</style>
<div class="content-wrapper" style="min-height: 1604.8px;">
    

    <!-- Main content -->
    <section class="content">
        <div class="row">
          <div class="col-md-3">

            <!-- Profile Image -->
            <div class="card card-primary card-outline">
              <div class="card-body box-profile">
                <div class="text-center">
                   <div class="profile-container">
                      <img class="profile-user-img" src="{{ session['profilepath'] }}" alt="User profile picture">

                      <!-- Label acts as a button for file input -->
                      <label for="profileImage" class="edit-icon">
                        <i class="fas fa-pencil-alt"></i>
                      </label>

                      <!-- Hidden File Input -->
                      <input type="file" id="profileImage" accept="image/*" onchange="uploadProfileImage(this)">
                    </div>
                </div>

                <h3 class="profile-username text-center">{{ session['user_name'] }}</h3>

              </div>
              <!-- /.card-body -->
            </div>
            <!-- /.card -->
          </div>
          <!-- /.col -->
          <div class="col-md-9">
            <div class="card">
              <div class="card-header p-2">
                <ul class="nav nav-pills">
                  <li class="nav-item"><a class="nav-link active" data-toggle="tab">Settings</a></li>
                </ul>
              </div><!-- /.card-header -->
              <div class="card-body">
                  <div class="tab-pane active" id="settings">
                    <form class="form-horizontal">
                      <div class="form-group row mb-3">
                        <label for="oldpassword" class="col-sm-2 col-form-label">Old Password</label>
                        <div class="col-sm-4">
                          <input type="password" class="form-control" id="oldpassword" placeholder="Old password">
                        </div>
                      </div>
                      <div class="form-group row mb-3">
                        <label for="newpassword" class="col-sm-2 col-form-label">New Password</label>
                        <div class="col-sm-4">
                          <input type="password" class="form-control" id="newpassword" placeholder="New password">
                        </div>
                      </div>
                      <div class="form-group row mb-3">
                        <label for="confirmpassword" class="col-sm-2 col-form-label">Confirm Password</label>
                        <div class="col-sm-4">
                          <input type="password" class="form-control" id="confirmpassword" placeholder="Confirm password">
                        </div>
                      </div>
                      <div class="form-group row">
                        <div class="offset-sm-2 col-sm-10">
                          <button type="submit" class="btn btn-danger">Update</button>
                        </div>
                      </div>
                    </form>
                  </div>
                  <!-- /.tab-pane -->
                </div>
                <!-- /.tab-content -->
              </div><!-- /.card-body -->
            </div>
            <!-- /.card -->
          </div>
          <!-- /.col -->
        </div>
    </section>
    <!-- /.content -->
     <script>
       function uploadProfileImage(input) {
  const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif'];

  if (input.files && input.files[0]) {
    const file = input.files[0];
    const fileName = file.name.toLowerCase();
    const fileExtension = fileName.split('.').pop();

    if (!allowedExtensions.includes(fileExtension)) {
      alert('Invalid file type. Only JPG, JPEG, PNG, and GIF are allowed.');
      input.value = ''; // reset file input
      return;
    }

    var formData = new FormData();
    formData.append('profileImage', file);

    $.ajax({
      url: '/settings/upload_profile_image',
      type: 'POST',
      data: formData,
      contentType: false,
      processData: false,
      success: function(response) {
        if (response.success) {
          $('.profile-user-img').attr('src', response.image_url);
          alert('Profile image updated successfully!');
        } else {
          alert('Image upload failed: ' + response.message);
        }
      },
      error: function() {
        alert('An error occurred while uploading the image.');
      }
    });
  }
}
     </script>
{%endblock%}
